<!doctype html>
<meta charset="utf-8">
<title>Robotics 101 teaser</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=block">
<style>
  :root {
    --ink: #23303a; --teal: #1f6f8b; --teal-light: #6fb6cf; --orange: #c2622d; --red: #b5322b;
    --paper: #f4f6f3; --night: #141c26; --mist: #b9c6cc;
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--night); }
  body { font-family: Inter, system-ui, sans-serif; }
  .layer { position: absolute; inset: 0; background: var(--night); opacity: 0; }
  .card { display: flex; align-items: center; padding: 0 140px; }
  .card .text { flex: 1; }

  .kicker { color: var(--teal-light); font-size: 30px; font-weight: 600; letter-spacing: 6px; margin-bottom: 36px; }
  .question { color: #fff; font-size: 70px; font-weight: 800; line-height: 1.12; }
  .question .line { display: block; }
  .question .line + .line { margin-top: 26px; }
  .question span span { display: inline-block; margin-right: 0.25em; }

  .window { position: absolute; left: 80px; top: 174px; width: 1300px; height: 731px; overflow: hidden;
            border-radius: 22px; background: var(--paper); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); }
  .window .zoom { position: absolute; inset: 0; transform-origin: 50% 45%; }
  .window img { position: absolute; }

  #learn { background: none; }
  .learn { position: absolute; left: 1440px; top: 196px; width: 420px; }
  .learn .header { color: var(--teal-light); font-size: 24px; font-weight: 600; letter-spacing: 5px; margin-bottom: 30px; }
  .learn .item { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 24px; }
  .learn .badge { flex: 0 0 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center;
                  font-size: 24px; font-weight: 800; color: #fff; background: var(--teal); }
  .learn .label { color: var(--mist); font-size: 27px; font-weight: 600; line-height: 1.2; padding-top: 4px; }
  .learn .item.active .badge { background: var(--orange); }
  .learn .item.active .label { color: #fff; font-size: 33px; font-weight: 800; }

  .title { color: #fff; font-size: 92px; font-weight: 800; line-height: 1.05; }
  .subtitle { color: var(--teal-light); font-size: 42px; font-weight: 600; margin-top: 22px; white-space: nowrap; }
  .tagline { color: var(--mist); font-size: 32px; margin-top: 44px; line-height: 1.35; white-space: nowrap; }
  .address { display: inline-block; margin-top: 52px; padding: 18px 30px; border-radius: 999px; background: var(--teal);
             color: #fff; font-size: 34px; font-weight: 600; }
  .credit { color: var(--mist); font-size: 24px; margin-top: 40px; letter-spacing: 2px; }
</style>

<div id="hook" class="layer card">
  <div class="text">
    <div class="kicker"></div>
    <div class="question"><span class="line" id="line1"></span><span class="line" id="line2"></span></div>
  </div>
  <svg class="arm" width="440" height="440"></svg>
</div>

<div id="shots"></div>

<div id="learn" class="layer">
  <div class="learn"><div class="header"></div><div id="items"></div></div>
</div>

<div id="end" class="layer card">
  <div class="text">
    <!-- The texts are set from END_CARD in teaser.js. -->
    <div class="kicker" data-part="label" data-rise="0"></div>
    <div class="title" data-part="title" data-rise="4"></div>
    <div class="subtitle" data-part="subtitle" data-rise="12"></div>
    <div class="tagline" data-part="tagline" data-rise="22"></div>
    <div class="address" data-part="address" data-rise="32"></div>
    <div class="credit" data-part="credit" data-rise="42"></div>
  </div>
  <svg class="arm" width="400" height="400"></svg>
</div>

<script src="teaser.js"></script>

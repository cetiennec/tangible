id: ik-beginners
title: Where does the arm's tip end up?
promise: Turn the two joints of a planar robot arm and watch the tip trace out
  everything it can reach.
tags:
  - robotics
  - kinematics
  - mathematics
scenes:
  planar: ./scenes/scene.ts
  redundant: ./scenes/redundant.ts
  so101: ./scenes/so101.ts
initialScene: planar
defaults:
  anticipation: -0.2
  ease: inOutCubic
  transition: 1.0
tts:
  provider: hf-endpoint
  voice: aiden
deployment:
  provider: huggingface
  space: cetiennec/ik-beginners
assistant:
  provider: huggingface
  model: google/gemma-4-31B-it:cerebras
  context: assistant.md
  commandable:
    - planar.q1
    - planar.q2
    - planar.l1
    - planar.l2
    - planar.show.workspace
    - planar.show.limits
    - planar.show.unreachable
    - redundant.spread
